name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity (docs/PLAN.md §10).
# Calls the public ping() function every 3 days.
# Needs repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets"
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
